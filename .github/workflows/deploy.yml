name: Deploy to Server

on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: Build Docker image
              run:
                docker build -t ${{ secrets.DOCKER_USERNAME }}/sio-order-service:latest .

            - name: Push Docker image
              run:
                docker push ${{ secrets.DOCKER_USERNAME }}/sio-order-service:latest

    deploy-ssh:
        name: Deploy via SSH
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Copy Docker Compose
              uses: appleboy/scp-action@v1
              with:
                host: ${{ secrets.SSH_SERVER }}
                username: ${{ secrets.SSH_USER }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                source: "deploy/docker-compose.yml"
                target: "/home/faizms14/project/sioms/order-service/"

            - name: Deploy to server
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.SSH_SERVER }}
                username: ${{ secrets.SSH_USER }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                  cd /home/faizms14/project/sioms/order-service
                  echo ${{ secrets.APP_ENV }} | base64 -d > .env
                  docker compose pull
                  docker compose up -d